server:
  port: 8081

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/paymentdb
      auto-index-creation: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    url: mongodb://localhost:27017/paymentdb

external:
  random-api:
    url: http://www.randomnumberapi.com/api/v1.0/random?min=1&max=100&count=1

kafka:
  bootstrap-servers: localhost:9099
  topic:
    payment: CREATE_PAYMENT